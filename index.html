<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐配方 TIDAL RECIPE｜你能喝下的海洋污染</title>
<style>
  :root{ --ink:#e8f0f4; --dim:#6b8494; --line:#1a3340; --pipe:#2a4a5a; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#050d12; color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; overflow-x:hidden; }
  a{ color:inherit; text-decoration:none; }

  /* 序曲 */
  .intro{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:40px 24px; position:relative; }
  .intro::before{ content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 30%, #0a2230 0%, #050d12 70%); z-index:-1; }
  .kicker{ letter-spacing:.5em; font-size:12px; color:var(--dim); margin-bottom:28px; text-transform:uppercase; }
  .title{ font-size:clamp(40px,9vw,96px); font-weight:200; letter-spacing:.15em; line-height:1.1; }
  .title b{ font-weight:600; }
  .title-en{ font-size:clamp(11px,2vw,15px); letter-spacing:.6em; color:var(--dim); margin-top:18px; }
  .lede{ max-width:640px; margin:44px auto 0; font-size:clamp(15px,2.4vw,19px); line-height:2; color:#a8c0cc; font-weight:300; }
  .lede em{ color:#5fd0e0; font-style:normal; }
  .scroll-hint{ position:absolute; bottom:32px; font-size:11px; letter-spacing:.3em; color:var(--dim); animation:pulse 2.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* 地图区 */
  .map-section{ min-height:100vh; padding:80px 24px 120px; position:relative; }
  .section-head{ text-align:center; margin-bottom:12px; }
  .section-head h2{ font-size:clamp(22px,4vw,34px); font-weight:300; letter-spacing:.2em; }
  .section-head p{ color:var(--dim); font-size:13px; margin-top:14px; letter-spacing:.15em; }
  .live-badge{ display:inline-flex; align-items:center; gap:8px; margin-top:20px; padding:7px 16px; border:1px solid var(--line); border-radius:99px; font-size:12px; color:#5fd0e0; letter-spacing:.1em; }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:#5fd0e0; box-shadow:0 0 8px #5fd0e0; animation:pulse 1.6s infinite; }

  .map-wrap{ max-width:1100px; margin:50px auto 0; position:relative; aspect-ratio:2/1; border:1px solid var(--line); border-radius:12px; background:
      linear-gradient(180deg, #071a24 0%, #04121a 100%);
      overflow:hidden; }
  .grid-lines{ position:absolute; inset:0; opacity:.25;
      background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size:64px 64px; }

  .point{ position:absolute; transform:translate(-50%,-50%); cursor:pointer; z-index:3; }
  .point-dot{ width:14px; height:14px; border-radius:50%; background:#5fd0e0; box-shadow:0 0 0 0 rgba(95,208,224,.6); animation:ping 2.6s infinite; }
  @keyframes ping{ 0%{ box-shadow:0 0 0 0 rgba(95,208,224,.5);} 70%{ box-shadow:0 0 0 18px rgba(95,208,224,0);} 100%{ box-shadow:0 0 0 0 rgba(95,208,224,0);} }
  .point-label{ position:absolute; left:22px; top:-8px; white-space:nowrap; font-size:12px; color:var(--ink); background:rgba(5,20,28,.85); padding:4px 9px; border:1px solid var(--line); border-radius:6px; opacity:0; transition:.3s; pointer-events:none; }
  .point:hover .point-label{ opacity:1; }
  .point:hover .point-dot{ background:#fff; }
  .point .reading{ display:block; font-size:10px; color:var(--dim); margin-top:2px; }

  .toast{ position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:#0a2230; border:1px solid var(--line); padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; transition:.4s; z-index:99; }

  .footer{ text-align:center; padding:60px 24px; color:var(--dim); font-size:12px; letter-spacing:.15em; line-height:2; }
  .footer b{ color:#a8c0cc; font-weight:400; }
</style>
</head>
<body>

<section class="intro">
  <div class="kicker">A Speculative Design · 概念饮品店</div>
  <h1 class="title">潮汐<b>配方</b></h1>
  <div class="title-en">T I D A L &nbsp; R E C I P E</div>
  <p class="lede">
    你面前这杯饮品，配方来自数千公里外<br>
    一片真实海域<em>此刻</em>的污染数据。<br><br>
    你不是在看一份环保报告——<br>
    你把它<em>喝了下去</em>。
  </p>
  <div class="scroll-hint">↓ 向下滑动，走进这片海</div>
</section>

<section class="map-section">
  <div class="section-head">
    <h2>八处正在生病的海</h2>
    <p>点击任意监测点，进入那杯为它调配的饮品</p>
    <div class="live-badge"><span class="live-dot"></span> 实时数据接入中 · Open-Meteo 全球监测网</div>
  </div>

  <div class="map-wrap">
    <div class="grid-lines"></div>
    <div id="points"></div>
  </div>
</section>

<div class="footer">
  <b>《潮汐配方》TIDAL RECIPE</b><br>
  一件关于海洋污染的思辨设计 · 数据实时驱动，配方随海而变<br>
  张一文 · 清华大学美术学院 艺术与科技
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const pointsEl = document.getElementById('points');

WATERS.forEach(w => {
  const p = document.createElement('a');
  p.className = 'point';
  p.href = `drink.html?w=${w.key}`;
  p.style.left = w.x + '%';
  p.style.top = w.y + '%';
  p.innerHTML = `
    <div class="point-dot"></div>
    <div class="point-label">${w.name}<span class="reading" id="r-${w.key}">读取实时数据…</span></div>
  `;
  pointsEl.appendChild(p);
});

// 拉取每个点的实时读数，显示在 hover 标签里
async function loadReadings(){
  for(const w of WATERS){
    try{
      let url, val, unit;
      if(w.metric === 'sst'){
        url = `https://marine-api.open-meteo.com/v1/marine?latitude=${w.lat}&longitude=${w.lon}&current=sea_surface_temperature`;
        const d = await (await fetch(url)).json();
        val = d.current.sea_surface_temperature; unit='°C';
      } else {
        url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${w.lat}&longitude=${w.lon}&current=${w.metric}`;
        const d = await (await fetch(url)).json();
        val = d.current[w.metric]; unit='μg/m³';
      }
      const el = document.getElementById('r-'+w.key);
      if(el) el.textContent = `${w.metricLabel}：${val} ${unit}`;
    }catch(e){
      const el = document.getElementById('r-'+w.key);
      if(el) el.textContent = '数据暂不可用';
    }
  }
}
loadReadings();
</script>
</body>
</html>
