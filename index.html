<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐配方 TIDAL RECIPE｜你能喝下的海洋污染</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif; color:#fff; background:#04121a; overflow-x:hidden; }
  a{ color:inherit; text-decoration:none; }

  /* 序曲：全屏海洋照 */
  .hero{ position:relative; min-height:100vh; display:flex; align-items:center; }
  .hero-bg{ position:absolute; inset:0; background:url(img/seto.jpg) center/cover; z-index:-2; }
  .hero-bg::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(4,18,26,.6),rgba(4,18,26,.1) 60%,rgba(4,18,26,.5)),linear-gradient(180deg,rgba(4,18,26,.4),transparent 30%,rgba(4,18,26,.75)); }
  .ghost{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; font-size:clamp(60px,16vw,240px); font-weight:200; letter-spacing:.1em; color:rgba(255,255,255,.09); z-index:-1; white-space:nowrap; user-select:none; }

  .topbar{ position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:26px 40px; z-index:20; }
  .brand{ font-size:15px; font-weight:600; letter-spacing:.25em; }
  .brand small{ display:block; font-size:9px; font-weight:300; letter-spacing:.4em; opacity:.7; margin-top:3px; }
  .nav{ display:flex; gap:38px; font-size:12px; letter-spacing:.28em; font-weight:300; }
  .nav a{ opacity:.85; } .nav a:hover{ opacity:1; }

  .hero-inner{ padding:0 40px; max-width:1240px; margin:0 auto; width:100%; }
  .hero .eyebrow{ font-size:12px; letter-spacing:.35em; opacity:.85; text-transform:uppercase; margin-bottom:22px; }
  .hero h1{ font-size:clamp(44px,9vw,110px); font-weight:200; line-height:1; letter-spacing:.04em; text-shadow:0 2px 40px rgba(0,0,0,.4); }
  .hero h1 b{ font-weight:500; }
  .hero .lede{ margin-top:34px; max-width:520px; font-size:clamp(15px,2.2vw,18px); line-height:2; font-weight:300; opacity:.92; text-shadow:0 1px 16px rgba(0,0,0,.5); }
  .hero .lede em{ color:#9EE6F0; font-style:normal; }
  .scroll{ position:absolute; bottom:34px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.3em; opacity:.7; animation:pulse 2.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  /* 海图区 */
  .map-section{ padding:100px 40px 120px; background:linear-gradient(180deg,#04121a,#061821); }
  .head{ text-align:center; margin-bottom:8px; }
  .head h2{ font-size:clamp(24px,4vw,38px); font-weight:200; letter-spacing:.15em; }
  .head p{ opacity:.6; font-size:13px; margin-top:14px; letter-spacing:.15em; }
  .live-badge{ display:inline-flex; align-items:center; gap:8px; margin-top:20px; padding:7px 16px; border:1px solid rgba(255,255,255,.25); border-radius:99px; font-size:12px; letter-spacing:.1em; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:#7CFC98; box-shadow:0 0 8px #7CFC98; animation:pulse 1.6s infinite; }

  .cards{ max-width:1240px; margin:56px auto 0; display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
  @media(max-width:1000px){ .cards{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:560px){ .cards{ grid-template-columns:1fr; } }
  .ocard{ position:relative; aspect-ratio:3/4; border-radius:18px; overflow:hidden; display:block; }
  .ocard img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .6s; }
  .ocard:hover img{ transform:scale(1.06); }
  .ocard::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(4,18,26,.15),rgba(4,18,26,.85)); }
  .ocard .info{ position:absolute; left:0; right:0; bottom:0; padding:22px 20px; z-index:2; }
  .ocard .glass-mini{ background:rgba(255,255,255,.10); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:14px 16px; }
  .ocard .wname{ font-size:16px; font-weight:400; letter-spacing:.04em; }
  .ocard .wdrink{ font-size:11px; opacity:.75; margin-top:4px; }
  .ocard .wreading{ font-size:11px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.18); letter-spacing:.05em; display:flex; align-items:center; gap:6px; }
  .ocard .wreading .d{ width:5px;height:5px;border-radius:50%;background:#7CFC98;box-shadow:0 0 6px #7CFC98; }

  .footer{ text-align:center; padding:56px 24px; opacity:.5; font-size:12px; letter-spacing:.15em; line-height:2; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">潮汐配方<small>TIDAL RECIPE</small></div>
  <nav class="nav"><a href="#map">海图 MAP</a><a href="#map">全部 ALL</a></nav>
</div>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="ghost">OCEAN</div>
  <div class="hero-inner">
    <div class="eyebrow">A Speculative Design · 概念饮品店</div>
    <h1>潮汐<b>配方</b></h1>
    <p class="lede">
      你面前这杯饮品，配方来自数千公里外<br>
      一片真实海域 <em>此刻</em> 的污染数据。<br>
      你不是在看环保报告——你把它 <em>喝了下去</em>。
    </p>
  </div>
  <div class="scroll">↓ 走进这八片海</div>
</section>

<section class="map-section" id="map">
  <div class="head">
    <h2>八处正在生病的海</h2>
    <p>背景是它此刻真实的样子 · 卡片里是它正在承受的污染</p>
    <div class="live-badge"><span class="live-dot"></span> 实时数据接入 · Open-Meteo 全球监测网</div>
  </div>
  <div class="cards" id="cards"></div>
</section>

<div class="footer">
  《潮汐配方》TIDAL RECIPE · 一件关于海洋污染的思辨设计<br>
  数据实时驱动，配方随海而变 · 张一文 清华大学美术学院 艺术与科技
</div>

<script src="data.js"></script>
<script>
const el = document.getElementById('cards');
WATERS.forEach(w=>{
  const a=document.createElement('a');
  a.className='ocard'; a.href=`drink.html?w=${w.key}`;
  a.innerHTML=`
    <img src="img/${w.key}.jpg" alt="${w.name}">
    <div class="info"><div class="glass-mini">
      <div class="wname">${w.name}</div>
      <div class="wdrink">${w.drink}</div>
      <div class="wreading"><span class="d"></span><span id="r-${w.key}">读取实时数据…</span></div>
    </div></div>`;
  el.appendChild(a);
});

async function loadReadings(){
  for(const w of WATERS){
    try{
      let val,unit;
      if(w.metric==='sst'){
        const d=await(await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${w.lat}&longitude=${w.lon}&current=sea_surface_temperature`)).json();
        val=d.current.sea_surface_temperature; unit='°C';
      }else{
        const d=await(await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${w.lat}&longitude=${w.lon}&current=${w.metric}`)).json();
        val=d.current[w.metric]; unit='μg/m³';
      }
      const e=document.getElementById('r-'+w.key);
      if(e) e.textContent=`${w.metricLabel} ${val} ${unit}`;
    }catch(e){ const x=document.getElementById('r-'+w.key); if(x)x.textContent='数据暂不可用'; }
  }
}
loadReadings();
</script>
</body>
</html>
