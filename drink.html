<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐配方｜饮品详情</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; font-family:"Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#fff; overflow:hidden; background:#04121a; }
  a{ color:inherit; text-decoration:none; }

  /* 背景：全屏真实海洋航拍照 */
  .bg{ position:fixed; inset:0; background-size:cover; background-position:center; z-index:-2; }
  .bg::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(4,18,26,.32) 0%, rgba(4,18,26,.05) 22%, rgba(4,18,26,.05) 62%, rgba(4,18,26,.55) 100%); }

  /* 顶栏：白色细字，宽字距，横跨顶部 */
  .topbar{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:34px 46px; z-index:10; font-weight:300; }
  .topbar .brand{ font-size:13px; letter-spacing:.34em; text-transform:uppercase; }
  .topbar .nav{ display:flex; gap:44px; font-size:11px; letter-spacing:.3em; text-transform:uppercase; }
  .topbar .nav a{ opacity:.85; transition:.3s; } .topbar .nav a:hover{ opacity:1; }
  .topbar .nav a.active{ opacity:1; border-bottom:1px solid rgba(255,255,255,.6); padding-bottom:4px; }

  /* 巨型半透明水印字 —— 贯穿画面中央，是视觉主角 */
  .ghost{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:clamp(90px,20vw,300px); font-weight:200; letter-spacing:.02em;
    color:rgba(255,255,255,.14); white-space:nowrap; z-index:0; pointer-events:none; user-select:none;
    text-shadow:0 2px 60px rgba(255,255,255,.06); }

  /* 左下：标题区 */
  .headline{ position:fixed; left:46px; bottom:74px; z-index:5; max-width:44%; }
  .headline .eyebrow{ font-size:11px; letter-spacing:.34em; opacity:.8; text-transform:uppercase; margin-bottom:16px; }
  .headline h1{ font-size:clamp(30px,4.6vw,60px); font-weight:200; line-height:1.02; letter-spacing:.02em;
    text-shadow:0 2px 30px rgba(0,0,0,.45); }
  .headline .zh{ font-size:clamp(18px,2.4vw,26px); font-weight:300; margin-top:10px; letter-spacing:.14em; opacity:.95;
    text-shadow:0 1px 18px rgba(0,0,0,.5); }
  .headline .coord{ margin-top:20px; font-size:11px; letter-spacing:.24em; opacity:.7; display:flex; align-items:center; gap:12px; }
  .headline .coord::before{ content:""; width:36px; height:1px; background:rgba(255,255,255,.5); }

  /* 右下：极简数据小字（不是卡片，直接排在角落） */
  .data{ position:fixed; right:46px; bottom:74px; z-index:5; text-align:right; max-width:40%; }
  .data .live{ display:inline-flex; align-items:center; gap:8px; font-size:10px; letter-spacing:.24em;
    text-transform:uppercase; opacity:.85; margin-bottom:20px; }
  .data .live .dot{ width:6px; height:6px; border-radius:50%; background:#7CFC98; box-shadow:0 0 8px #7CFC98; animation:blink 1.6s infinite; }
  @keyframes blink{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
  .data .metric{ display:flex; align-items:baseline; justify-content:flex-end; gap:8px; margin-bottom:6px; }
  .data .metric .num{ font-size:clamp(40px,6vw,72px); font-weight:100; line-height:1; text-shadow:0 2px 24px rgba(0,0,0,.5); }
  .data .metric .unit{ font-size:13px; opacity:.75; }
  .data .mlabel{ font-size:11px; letter-spacing:.2em; opacity:.7; text-transform:uppercase; margin-bottom:22px; }
  .data .line{ font-size:11px; letter-spacing:.12em; opacity:.72; line-height:2.1; }
  .data .line b{ font-weight:400; opacity:1; }
  .data .drink{ margin-top:18px; font-size:13px; letter-spacing:.08em; font-weight:300; opacity:.95; }
  .data .recipe{ margin-top:8px; font-size:10.5px; letter-spacing:.06em; opacity:.62; line-height:1.9; }
  .data .updated{ margin-top:16px; font-size:9px; letter-spacing:.14em; opacity:.42; text-transform:uppercase; }

  /* 左上竖排页码/坐标 */
  .side{ position:fixed; left:46px; top:50%; transform:translateY(-50%); z-index:6;
    writing-mode:vertical-rl; font-size:10px; letter-spacing:.3em; opacity:.55; text-transform:uppercase; }

  /* 底部左右切换 */
  .nav-arrow{ position:fixed; bottom:30px; z-index:10; font-size:10px; letter-spacing:.24em; opacity:.7; text-transform:uppercase; transition:.3s; }
  .nav-arrow:hover{ opacity:1; }
  .prev{ display:none; } /* 用左下标题占位，右上放下一片 */
  .next{ right:46px; top:34px; bottom:auto; }

  @media(max-width:820px){
    .headline{ max-width:88%; bottom:auto; top:40%; }
    .data{ max-width:88%; left:46px; right:46px; text-align:left; bottom:40px; top:auto; }
    .data .metric{ justify-content:flex-start; }
    .ghost{ font-size:22vw; }
    .side{ display:none; }
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="ghost" id="ghost">OCEAN</div>

<div class="topbar">
  <div class="brand">潮汐配方 · TIDAL RECIPE</div>
  <nav class="nav">
    <a href="index.html">Map</a>
    <a class="active">This Sea</a>
    <a href="index.html">All</a>
  </nav>
</div>

<a class="nav-arrow next" id="next">Next Sea →</a>
<div class="side" id="side">—</div>

<!-- 左下：海域标题 -->
<div class="headline">
  <div class="eyebrow" id="eyebrow">POLLUTED WATER</div>
  <h1 id="name-en">—</h1>
  <div class="zh" id="name-zh">—</div>
  <div class="coord" id="coord">—</div>
</div>

<!-- 右下：实时数据极简小字 -->
<div class="data">
  <div class="live"><span class="dot"></span> Live Data · Open-Meteo</div>
  <div class="metric"><span class="num" id="m-num">—</span><span class="unit" id="m-unit"></span></div>
  <div class="mlabel" id="m-label">—</div>
  <div class="line"><b id="pollutant">—</b></div>
  <div class="line">海表温度 <b id="sst">—</b></div>
  <div class="line" id="conc">污染浓度 —</div>
  <div class="drink" id="drink">—</div>
  <div class="recipe" id="recipe">—</div>
  <div class="updated" id="updated"></div>
</div>

<script src="data.js"></script>
<script>
window._errs=[]; window.onerror=(m,s,l)=>{window._errs.push(m+' @'+l);};
const params = new URLSearchParams(location.search);
const key = params.get('w') || 'gpgp';
const idx = Math.max(0, WATERS.findIndex(x=>x.key===key));
const w = WATERS[idx] || WATERS[0];
const nextW = WATERS[(idx+1)%WATERS.length];

document.getElementById('bg').style.backgroundImage = `url(img/${w.key}.jpg)`;
document.getElementById('ghost').textContent = w.nameEn.toUpperCase().split(' ')[0];
document.title = `潮汐配方｜${w.drink}`;

document.getElementById('eyebrow').textContent = w.pollutantEn.toUpperCase();
document.getElementById('name-en').textContent = w.nameEn;
document.getElementById('name-zh').textContent = w.name;
document.getElementById('coord').textContent = `${w.lat.toFixed(1)}° , ${w.lon.toFixed(1)}°`;
document.getElementById('side').textContent = `${String(idx+1).padStart(2,'0')} / ${String(WATERS.length).padStart(2,'0')} · ${w.name}`;
document.getElementById('m-label').textContent = w.metricLabel;
document.getElementById('pollutant').textContent = w.pollutant;
document.getElementById('drink').textContent = w.drink;
document.getElementById('recipe').textContent = w.toppings.join(' · ');
document.getElementById('next').href = `drink.html?w=${nextW.key}`;

async function load(){
  let mv=0, unit='μg/m³', sst=null, intensity=0.5;
  try{
    const md = await (await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${w.lat}&longitude=${w.lon}&current=sea_surface_temperature`)).json();
    sst = md.current.sea_surface_temperature;
    if(w.metric==='sst'){ mv=sst; unit='°C'; intensity=normalizeMetric('sst',sst); }
    else{
      const ad = await (await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${w.lat}&longitude=${w.lon}&current=${w.metric}`)).json();
      mv=ad.current[w.metric]; intensity=normalizeMetric(w.metric,mv);
    }
  }catch(e){ document.getElementById('conc').textContent='污染浓度 · 数据暂不可用'; }

  document.getElementById('m-num').textContent = mv;
  document.getElementById('m-unit').textContent = unit;
  document.getElementById('sst').textContent = sst!=null ? sst+' °C' : '暂无';
  const lvl = intensity>0.66?'重度 · 今天格外浓重':intensity>0.33?'中度':'轻度 · 今天稍好';
  document.getElementById('conc').textContent = `污染浓度 ${Math.round(intensity*100)}% · ${lvl}`;
  document.getElementById('updated').textContent = '更新于 '+new Date().toLocaleString('zh-CN');
}
load();
</script>
</body>
</html>
