<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐配方｜饮品详情</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif; color:#fff; overflow-x:hidden; background:#04121a; }
  a{ color:inherit; text-decoration:none; }

  /* 背景：真实海洋航拍照片，铺满 */
  .bg{ position:fixed; inset:0; background-size:cover; background-position:center; z-index:-2; transition:opacity 1.2s; }
  .bg::after{ content:""; position:absolute; inset:0; background:
      linear-gradient(90deg, rgba(4,18,26,.55) 0%, rgba(4,18,26,.15) 55%, rgba(4,18,26,.45) 100%),
      linear-gradient(180deg, rgba(4,18,26,.5) 0%, transparent 25%, transparent 60%, rgba(4,18,26,.7) 100%); }

  /* 顶栏 */
  .topbar{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:26px 40px; z-index:10; }
  .brand{ font-size:15px; font-weight:600; letter-spacing:.25em; }
  .brand small{ display:block; font-size:9px; font-weight:300; letter-spacing:.4em; opacity:.7; margin-top:3px; }
  .nav{ display:flex; gap:38px; font-size:12px; letter-spacing:.28em; font-weight:300; }
  .nav a{ opacity:.85; transition:.3s; } .nav a:hover{ opacity:1; }
  .nav a.active{ border-bottom:1px solid rgba(255,255,255,.6); padding-bottom:4px; }

  /* 左侧竖排 */
  .side{ position:fixed; left:40px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:22px; z-index:10; font-size:11px; letter-spacing:.2em; font-weight:300; }
  .side a{ writing-mode:vertical-rl; opacity:.7; transition:.3s; } .side a:hover{ opacity:1; }
  .side .dot{ width:5px; height:5px; border-radius:50%; background:#fff; opacity:.6; }

  /* 巨型水印海域名 */
  .ghost{ position:fixed; left:0; right:0; top:52%; transform:translateY(-50%); text-align:center; font-size:clamp(60px,15vw,220px); font-weight:200; letter-spacing:.08em; color:rgba(255,255,255,.10); white-space:nowrap; z-index:-1; pointer-events:none; user-select:none; }

  /* 主内容区 */
  .stage{ min-height:100vh; display:flex; align-items:center; padding:120px 40px 60px; position:relative; z-index:5; }
  .layout{ width:100%; max-width:1240px; margin:0 auto; display:grid; grid-template-columns:1.1fr .9fr; gap:60px; align-items:center; }
  @media(max-width:900px){ .layout{ grid-template-columns:1fr; gap:36px; } }

  /* 左：标题区 */
  .headline .eyebrow{ font-size:12px; letter-spacing:.35em; opacity:.8; text-transform:uppercase; margin-bottom:20px; }
  .headline h1{ font-size:clamp(40px,7vw,76px); font-weight:200; line-height:1.05; letter-spacing:.02em; text-shadow:0 2px 30px rgba(0,0,0,.4); }
  .headline .zh{ font-size:clamp(28px,4vw,42px); font-weight:300; margin-top:10px; letter-spacing:.06em; }
  .headline .coord{ margin-top:28px; font-size:13px; letter-spacing:.2em; opacity:.75; display:flex; align-items:center; gap:14px; }
  .headline .coord::before{ content:""; width:40px; height:1px; background:rgba(255,255,255,.5); }
  .headline .story{ margin-top:26px; max-width:440px; font-size:15px; line-height:2; font-weight:300; opacity:.9; text-shadow:0 1px 16px rgba(0,0,0,.5); }

  /* 右：玻璃卡片 */
  .glass{ background:rgba(255,255,255,.10); backdrop-filter:blur(22px) saturate(1.2); -webkit-backdrop-filter:blur(22px) saturate(1.2); border:1px solid rgba(255,255,255,.22); border-radius:24px; padding:34px 34px 30px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .glass .gtag{ display:inline-flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.15em; padding:6px 14px; border:1px solid rgba(255,255,255,.3); border-radius:99px; margin-bottom:22px; }
  .glass .gtag .live{ width:6px; height:6px; border-radius:50%; background:#7CFC98; box-shadow:0 0 8px #7CFC98; animation:blink 1.6s infinite; }
  @keyframes blink{ 0%,100%{opacity:.4;} 50%{opacity:1;} }
  .glass .drink{ font-size:26px; font-weight:300; letter-spacing:.04em; margin-bottom:4px; }
  .glass .sub{ font-size:12px; opacity:.7; letter-spacing:.1em; margin-bottom:22px; }

  .metric-hero{ display:flex; align-items:baseline; gap:10px; padding:16px 0; border-top:1px solid rgba(255,255,255,.18); border-bottom:1px solid rgba(255,255,255,.18); margin-bottom:18px; }
  .metric-hero .num{ font-size:44px; font-weight:200; line-height:1; }
  .metric-hero .unit{ font-size:14px; opacity:.7; }
  .metric-hero .name{ margin-left:auto; text-align:right; font-size:11px; letter-spacing:.12em; opacity:.7; line-height:1.6; }

  .row{ display:flex; justify-content:space-between; padding:9px 0; font-size:13px; }
  .row .k{ opacity:.65; } .row .v{ text-align:right; max-width:60%; }
  .row .v.hot{ color:#FFD98A; }

  .recipe-title{ font-size:11px; letter-spacing:.2em; opacity:.6; margin:20px 0 12px; text-transform:uppercase; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:11px; padding:6px 12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:99px; }

  .conc{ margin-top:22px; }
  .conc .bar{ height:5px; background:rgba(255,255,255,.15); border-radius:3px; overflow:hidden; }
  .conc .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#7CFC98,#FFD98A,#FF8A8A); transition:width 1.4s; }
  .conc .lbl{ display:flex; justify-content:space-between; font-size:11px; opacity:.7; margin-top:8px; letter-spacing:.1em; }

  .updated{ font-size:10px; opacity:.5; margin-top:18px; letter-spacing:.1em; }

  .back{ position:fixed; bottom:34px; left:40px; z-index:10; font-size:12px; letter-spacing:.2em; opacity:.85; display:flex; align-items:center; gap:10px; }
  .back::before{ content:"←"; }
  .next{ position:fixed; bottom:34px; right:40px; z-index:10; font-size:12px; letter-spacing:.2em; opacity:.85; display:flex; align-items:center; gap:10px; }
  .next::after{ content:"→"; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="ghost" id="ghost">OCEAN</div>

<div class="topbar">
  <div class="brand">潮汐配方<small>TIDAL RECIPE</small></div>
  <nav class="nav">
    <a href="index.html">海图 MAP</a>
    <a class="active">此海 THIS SEA</a>
    <a href="index.html">全部 ALL</a>
  </nav>
</div>

<div class="side">
  <div class="dot"></div>
  <a href="index.html">MENU</a>
  <a id="side-coord">—</a>
</div>

<div class="stage">
  <div class="layout">
    <!-- 左：标题叙事 -->
    <div class="headline">
      <div class="eyebrow" id="eyebrow">POLLUTED WATER</div>
      <h1 id="name-en">—</h1>
      <div class="zh" id="name-zh">—</div>
      <div class="coord" id="coord">—</div>
      <p class="story" id="story">—</p>
    </div>

    <!-- 右：玻璃数据卡 -->
    <div class="glass">
      <div class="gtag"><span class="live"></span> 实时监测 · LIVE DATA</div>
      <div class="drink" id="drink">—</div>
      <div class="sub" id="base">—</div>

      <div class="metric-hero">
        <div class="num" id="m-num">—</div>
        <div class="unit" id="m-unit"></div>
        <div class="name" id="m-name">—</div>
      </div>

      <div class="row"><span class="k">主要污染物</span><span class="v" id="pollutant">—</span></div>
      <div class="row"><span class="k">海表温度</span><span class="v hot" id="sst">—</span></div>
      <div class="row"><span class="k">污染事实</span><span class="v" id="fact">—</span></div>

      <div class="recipe-title">配方构成 · 随污染实时调整</div>
      <div class="chips" id="chips"></div>

      <div class="conc">
        <div class="bar"><i id="conc-bar"></i></div>
        <div class="lbl"><span>污染浓度</span><span id="conc-txt">—</span></div>
      </div>

      <div class="updated" id="updated"></div>
    </div>
  </div>
</div>

<a href="index.html" class="back">返回海图</a>
<a class="next" id="next">下一片海</a>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const key = params.get('w') || 'gpgp';
const idx = Math.max(0, WATERS.findIndex(x=>x.key===key));
const w = WATERS[idx] || WATERS[0];
const nextW = WATERS[(idx+1)%WATERS.length];

// 背景照片
document.getElementById('bg').style.backgroundImage = `url(img/${w.key}.jpg)`;
document.getElementById('ghost').textContent = w.nameEn.toUpperCase().split(' ')[0];
document.title = `潮汐配方｜${w.drink}`;

// 静态填充
document.getElementById('eyebrow').textContent = w.pollutantEn.toUpperCase();
document.getElementById('name-en').textContent = w.nameEn;
document.getElementById('name-zh').textContent = w.name;
document.getElementById('coord').textContent = `${w.lat.toFixed(1)}°, ${w.lon.toFixed(1)}°`;
document.getElementById('side-coord').textContent = `${w.lat.toFixed(0)}° / ${w.lon.toFixed(0)}°`;
document.getElementById('story').textContent = w.story;
document.getElementById('drink').textContent = w.drink;
document.getElementById('base').textContent = w.base;
document.getElementById('pollutant').textContent = w.pollutant;
document.getElementById('fact').textContent = w.fact;
document.getElementById('m-name').innerHTML = w.metricLabel + '<br>实时读数';
document.getElementById('next').href = `drink.html?w=${nextW.key}`;

const chips = document.getElementById('chips');
w.toppings.forEach(t=>{ const c=document.createElement('span'); c.className='chip'; c.textContent=t; chips.appendChild(c); });

async function load(){
  let mv=0, unit='μg/m³', sst=null, intensity=0.5;
  try{
    const md = await (await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${w.lat}&longitude=${w.lon}&current=sea_surface_temperature`)).json();
    sst = md.current.sea_surface_temperature;
    if(w.metric==='sst'){ mv=sst; unit='°C'; intensity=normalizeMetric('sst',sst); }
    else{
      const ad = await (await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${w.lat}&longitude=${w.lon}&current=${w.metric}`)).json();
      mv=ad.current[w.metric]; intensity=normalizeMetric(w.metric,mv);
    }
  }catch(e){ document.getElementById('conc-txt').textContent='数据暂不可用'; }

  document.getElementById('m-num').textContent = mv;
  document.getElementById('m-unit').textContent = unit;
  document.getElementById('sst').textContent = sst!=null ? sst+' °C' : '暂无';
  document.getElementById('conc-bar').style.width = (intensity*100)+'%';
  document.getElementById('conc-txt').textContent =
    intensity>0.66?'重度 · 今天格外浓重':intensity>0.33?'中度':'轻度 · 今天稍好';
  document.getElementById('updated').textContent =
    '更新于 '+new Date().toLocaleString('zh-CN')+' · Open-Meteo';
}
load();
</script>
</body>
</html>
